/* MINIATURAS DE VIDEO: se cargan solo al entrar en pantalla */
var vids=document.querySelectorAll('video.tv[data-video]');
function ld(v){v.addEventListener('loadedmetadata',function(){try{v.currentTime=Math.min(1.2,(v.duration||3)*.35);}catch(x){}},{once:true});v.preload='metadata';v.src=v.dataset.video;v.removeAttribute('data-video');}
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){ld(en.target);io.unobserve(en.target);}});},{rootMargin:'250px'});vids.forEach(function(v){io.observe(v);});}else{vids.forEach(ld);}
